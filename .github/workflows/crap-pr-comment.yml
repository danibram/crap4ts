name: CRAP PR comment

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: crap-pr-comment-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  comment:
    name: Generate baseline + post sticky comment
    runs-on: ubuntu-latest
    steps:
      # Two checkouts so we can scan `main` and the PR independently without
      # juggling git state. `path:` puts them in sibling subdirectories.
      - name: Checkout base branch (main)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.base_ref }}
          path: base

      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          path: pr

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Install base deps
        working-directory: base
        run: bun install --frozen-lockfile

      - name: Build base + run coverage
        working-directory: base
        run: |
          bun run build
          bun run test:cov

      - name: Generate main baseline
        working-directory: base
        run: |
          node dist/cli.js src/ examples/ \
            -c coverage/coverage-final.json \
            --reporter json \
            --output /tmp/crap-baseline.json

      - name: Install PR deps
        working-directory: pr
        run: bun install --frozen-lockfile

      - name: Build PR + run coverage
        working-directory: pr
        run: |
          bun run build
          bun run test:cov

      - name: Render PR comment
        working-directory: pr
        # `|| true` because --fail-regression returns exit 1 — but we still
        # want to post the comment so reviewers can see what regressed.
        run: |
          node dist/cli.js src/ examples/ \
            -c coverage/coverage-final.json \
            --baseline /tmp/crap-baseline.json \
            --reporter pr-comment \
            --output /tmp/crap-comment.md || true

      - name: Post sticky comment
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: crap4ts-report
          path: /tmp/crap-comment.md
