name: CRAP gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write
  # github/codeql-action/upload-sarif needs this to post results to Code
  # Scanning. Granted for both PR and main jobs so the Security tab and the
  # inline PR-diff annotations both work.
  security-events: write

# Same group string for PR and push events: a brand-new push to main
# cancels any in-flight run on the same SHA, and re-pushing a PR branch
# cancels its previous run.
concurrency:
  group: crap-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # PR job: baseline diff + sticky bot comment + SARIF upload.
  # The baseline is built live from `main` so PRs are always compared against
  # the actual default-branch state at the time the workflow runs, not a
  # stashed artifact that could drift.
  # ---------------------------------------------------------------------------
  pr:
    if: github.event_name == 'pull_request'
    name: PR baseline diff + comment + SARIF
    runs-on: ubuntu-latest
    steps:
      - name: Checkout base branch (main)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.base_ref }}
          path: base

      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          path: pr

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Install base deps
        working-directory: base
        run: bun install --frozen-lockfile

      - name: Build base + run coverage
        working-directory: base
        run: |
          bun run build
          bun run test:cov

      - name: Generate main baseline
        working-directory: base
        run: |
          node dist/cli.js src/ \
            -c coverage/coverage-final.json \
            --reporter json \
            --output /tmp/crap-baseline.json

      - name: Install PR deps
        working-directory: pr
        run: bun install --frozen-lockfile

      - name: Build PR + run coverage
        working-directory: pr
        run: |
          bun run build
          bun run test:cov

      - name: Render PR comment
        working-directory: pr
        # `|| true` because --fail-regression returns exit 1 — but we still
        # want to post the comment so reviewers can see what regressed.
        run: |
          node dist/cli.js src/ examples/ \
            -c coverage/coverage-final.json \
            --baseline /tmp/crap-baseline.json \
            --reporter pr-comment \
            --output /tmp/crap-comment.md || true

      - name: Post sticky comment
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: crap4ts-report
          path: /tmp/crap-comment.md

      - name: Render SARIF
        working-directory: pr
        run: |
          node dist/cli.js src/ examples/ \
            -c coverage/coverage-final.json \
            --reporter sarif \
            --threshold 30 \
            --fail-on 100 \
            --output /tmp/crap.sarif || true

      - name: Upload SARIF to Code Scanning
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: /tmp/crap.sarif
          category: crap4ts

  # ---------------------------------------------------------------------------
  # Main job: scan the default branch and push results to Code Scanning so
  # the Security tab carries the canonical "current state". Without this,
  # findings exist only on PR refs (transient) and the Security UI stays
  # empty — which is what every reviewer notices first.
  # ---------------------------------------------------------------------------
  main:
    if: github.event_name == 'push'
    name: Main SARIF
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun run test:cov

      - name: Render SARIF
        # Same thresholds as the PR job so findings line up across refs and
        # Code Scanning's fingerprint matching can track them cleanly.
        run: |
          node dist/cli.js src/ examples/ \
            -c coverage/coverage-final.json \
            --reporter sarif \
            --threshold 30 \
            --fail-on 100 \
            --output /tmp/crap.sarif || true

      - name: Upload SARIF to Code Scanning
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: /tmp/crap.sarif
          category: crap4ts
